name: ig-publish

# 인스타·스레드 게시 전용. cron-job.org 가 한국 시간 10:30·12:30·15:30·18:30·22:00 에 호출한다.
# (이미지·영상은 webzine.yml 이 3시간마다 만들어 사이트에 배포해 둔다)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-publish
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  SITE_URL: ${{ vars.SITE_URL }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ENABLED: ${{ vars.IG_ENABLED }}
  IG_EN_ACCESS_TOKEN: ${{ secrets.IG_EN_ACCESS_TOKEN }}
  IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
  IG_EN_ENABLED: ${{ vars.IG_EN_ENABLED }}
  THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
  THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
  IG_PUBLISH_MAX: ${{ vars.IG_PUBLISH_MAX || '2' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한국어 계정 (+ 스레드)
        continue-on-error: true
        run: python -u ig_post.py publish
      - name: 영문 계정
        continue-on-error: true
        run: IG_PROFILE=en python -u ig_post.py publish
      - name: 게시 기록 커밋
        run: |
          git config user.name "webzine-bot"
          git config user.email "webzine-bot@users.noreply.github.com"
          git config merge.jsonunion.driver "python merge_data.py %O %A %B"   # data/*.json 은 덮어쓰지 않고 합친다
          git add data
          git diff --cached --quiet || (git commit -m "인스타 게시 기록" && git pull --rebase && git push)
