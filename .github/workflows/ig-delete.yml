name: ig-delete

# 잘못 올라간 인스타 게시물 삭제 (수동 실행, 미디어 ID 입력)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "삭제할 미디어 ID (쉼표로 구분)"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u ig_post.py delete
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_DELETE_IDS: ${{ github.event.inputs.ids }}
