name: webzine

on:
  schedule:
    # GitHub 는 정각 예약을 혼잡할 때 자주 건너뛴다 → 매시간 17분에 깨우고,
    # 실제 작성은 마지막 실행 후 150분 이상 지났을 때만 (webzine.py 의 MIN_GAP_MIN)
    - cron: "17 * * * *"
  push:
    branches: [main]        # 검수 승인/거절을 push 하면 사이트만 다시 빌드
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: webzine
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  LLM: gemini
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
  IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_EN_ACCESS_TOKEN: ${{ secrets.IG_EN_ACCESS_TOKEN }}
  IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
  IG_EN_ENABLED: ${{ vars.IG_EN_ENABLED }}
  IG_EN_HANDLE: ${{ vars.IG_EN_HANDLE }}
  THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
  THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
  IG_ENABLED: ${{ vars.IG_ENABLED }}
  IG_DAILY: ${{ vars.IG_DAILY || '2' }}   # 카드뉴스는 하루 2건 (도달은 릴스가 담당)
  IG_REELS_DAILY: ${{ vars.IG_REELS_DAILY || '4' }}
  IG_FORCE: ${{ contains(github.event.head_commit.message, '[ig-now]') && '1' || '' }}
  IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
  MAX_ARTICLES: ${{ vars.MAX_ARTICLES || '12' }}
  REVIEW_ALL: ${{ vars.REVIEW_ALL || '0' }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
  ADSENSE_SLOT_HOME: ${{ vars.ADSENSE_SLOT_HOME }}
  ADSENSE_SLOT_ARTICLE: ${{ vars.ADSENSE_SLOT_ARTICLE }}
  SITE_URL: ${{ vars.SITE_URL }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집·기사 작성
        if: github.event_name != 'push'
        continue-on-error: true   # 실패해도 경고로 표시하고 기존 기사로 빌드·배포는 계속
        run: |
          python -u webzine.py
          python -u esports.py || true   # 롤드컵 기간: 한국팀 새 결과가 있으면 결과표 + 기사

      - name: 할인 정보 갱신 (push 때)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python -u webzine.py deals

      - name: 사이트 빌드
        run: python webzine.py build

      - name: 인스타 준비 (캐러셀 이미지 생성)
        continue-on-error: true
        run: |
          pip install -q pillow numpy imageio-ffmpeg "opencv-python-headless<5"   # 얼굴 인식(스마트 크롭)
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true  # 영상 캐러셀: 스팀 HLS 트레일러를 받으려면 시스템 ffmpeg 필요
          ffmpeg -version | head -1
          python -u ig_post.py prepare
          if [ -n "$IG_EN_USER_ID" ]; then IG_PROFILE=en python -u ig_post.py prepare; fi
          if [ "${{ github.event_name }}" = "push" ]; then python -u ig_post.py check; fi

      - name: 인스타 인사이트 (하루 한 번 수집, 페이지는 매번)
        continue-on-error: true
        run: |
          if [ "$IG_ENABLED" = "1" ] && { [ ! -f data/insights.json ] || [ $(( $(date +%s) - $(python -c "import json;print(int(json.load(open('data/insights.json'))['updated']))") )) -gt 72000 ]; }; then python -u insights.py collect; fi
          python -u insights.py page

      - name: 데이터 커밋
        if: always()
        continue-on-error: true   # 동시에 다른 커밋이 들어와 충돌해도 배포는 진행
        run: |
          git config user.name "webzine-bot"
          git config user.email "webzine-bot@users.noreply.github.com"
          git config merge.jsonunion.driver "python merge_data.py %O %A %B"   # data/*.json 은 덮어쓰지 않고 합친다
          git add data media
          git diff --cached --quiet || (git commit -m "새 기사 $(date '+%m-%d %H:%M')" && (git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours)) && git push)

      - name: 실패 알림 (이슈 생성 → 이메일)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label build-failure --json number --jq length | grep -qx 0 &&           gh issue create --title "⚠️ 알트탭 실행 실패 $(date '+%m-%d %H:%M')" --label build-failure             --body "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" ||           gh label create build-failure --color d73a4a 2>/dev/null &&           gh issue create --title "⚠️ 알트탭 실행 실패 $(date '+%m-%d %H:%M')" --label build-failure             --body "실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    needs: deploy                # 이미지가 사이트에 올라간 뒤에 게시
    # 3시간마다 실행될 때 2건씩 게시 (10~23시만, ig_post.py 가 시간 확인). '[ig-now]' 커밋은 즉시 게시
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ig-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 인스타 게시
        continue-on-error: true
        env:
          IG_PUBLISH_MAX: ${{ vars.IG_PUBLISH_MAX || '2' }}
        run: |
          python -u ig_post.py publish
          if [ -n "$IG_EN_USER_ID" ]; then IG_PROFILE=en python -u ig_post.py publish; fi
      - name: 게시 기록 커밋
        run: |
          git config user.name "webzine-bot"
          git config user.email "webzine-bot@users.noreply.github.com"
          git config merge.jsonunion.driver "python merge_data.py %O %A %B"   # data/*.json 은 덮어쓰지 않고 합친다
          git add data media
          git diff --cached --quiet || (git commit -m "인스타 게시 기록" && git pull --rebase && git push)
