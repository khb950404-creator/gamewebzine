name: webzine

on:
  schedule:
    # GitHub 는 정각 예약을 혼잡할 때 자주 건너뛴다 → 매시간 17분에 깨우고,
    # 실제 작성은 마지막 실행 후 150분 이상 지났을 때만 (webzine.py 의 MIN_GAP_MIN)
    - cron: "17 * * * *"
  push:
    branches: [main]        # 검수 승인/거절을 push 하면 사이트만 다시 빌드
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webzine
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  LLM: gemini
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
  IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
  IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
  MAX_ARTICLES: ${{ vars.MAX_ARTICLES || '12' }}
  REVIEW_ALL: ${{ vars.REVIEW_ALL || '0' }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
  ADSENSE_SLOT_HOME: ${{ vars.ADSENSE_SLOT_HOME }}
  ADSENSE_SLOT_ARTICLE: ${{ vars.ADSENSE_SLOT_ARTICLE }}
  SITE_URL: ${{ vars.SITE_URL }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집·기사 작성
        if: github.event_name != 'push'
        continue-on-error: true   # 실패해도 경고로 표시하고 기존 기사로 빌드·배포는 계속
        run: python -u webzine.py

      - name: 할인 정보 갱신 (push 때)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python -u webzine.py deals

      - name: 사이트 빌드
        run: python webzine.py build

      - name: 데이터 커밋
        if: always()
        run: |
          git config user.name "webzine-bot"
          git config user.email "webzine-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "새 기사 $(date '+%m-%d %H:%M')" && git pull --rebase && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
